  }
  .sr-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; }

  .upload-card{
    position:absolute;
    top:calc(var(--px)*820);
    left:calc(var(--px)*175);
    width:calc(var(--px)*676);
    height:calc(var(--px)*535);
  }

  .dropzone{
    position:absolute;
    top:calc(var(--px)*138);
    left:calc(var(--px)*33);
    width:calc(var(--px)*615);
    height:calc(var(--px)*210);
    cursor:pointer;
    display:block;
    background:transparent;
    border:none;
  }
  input[type=file]{ display:none; }

  .files-panel{
    position:absolute;
    top:calc(var(--px)*350);
    left:calc(var(--px)*10);
    width:calc(var(--px)*656);
    height:calc(var(--px)*200);
    padding:calc(var(--px)*18) calc(var(--px)*22) calc(var(--px)*14);
    background:rgb(11,29,47);
    border-radius:calc(var(--px)*4);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .files-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:calc(var(--px)*24);
    letter-spacing:.12em;
    color:var(--gold-light);
    font-weight:500;
  }
  .files-sub{
    font-size:calc(var(--px)*20);
    color:var(--cream);
    opacity:.75;
    margin-top:calc(var(--px)*8);
  }
  .files-divider{
    height:1px;
    background:var(--line);
    margin:calc(var(--px)*14) 0 calc(var(--px)*10);
    flex-shrink:0;
  }
  .files-body{ flex:1; overflow-y:auto; min-height:0; }
  .files-empty{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:calc(var(--px)*10);
    color:var(--cream);
    opacity:.7;
    font-size:calc(var(--px)*22);
    text-align:center;
  }
  .files-empty svg{ width:calc(var(--px)*46); height:calc(var(--px)*46); opacity:.8; flex-shrink:0; }

  .filelist{ display:none; flex-direction:column; gap:calc(var(--px)*8); }
  .filelist.has-files{ display:flex; }
  .files-empty.hidden{ display:none; }

  .file-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:calc(var(--px)*22);
    color:var(--cream);
    padding:calc(var(--px)*4) 0;
  }
  .file-row .status{ font-size:calc(var(--px)*19); color:var(--gold-light); white-space:nowrap; margin-left:calc(var(--px)*10); }
  .file-row.done .status{ color:#9fc7a8; }
  .file-row.error .status{ color:#e19b9b; }

  .footer-note{
    text-align:center;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--navy-deep);
    padding:26px 20px 34px;
  }
</style>
</head>
<body>

<div class="page">
  <div class="upload-card">
    <label class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="image/*" multiple capture="environment">
    </label>

    <div class="files-panel">
      <div class="files-header"><span>FICHEIROS SELECIONADOS</span><span id="filesCount">0/10</span></div>
      <div class="files-sub">As suas fotografias serão guardadas com todo o cuidado.</div>
      <div class="files-divider"></div>
      <div class="files-body">
        <div class="files-empty" id="filesEmpty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
            <rect x="3" y="4" width="18" height="15" rx="2"/>
            <circle cx="8.5" cy="9.5" r="1.5"/>
            <path d="M21 15l-5-5-4 4-3-3-5 5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div>Ainda não adicionou nenhuma fotografia</div>
        </div>
        <div class="filelist" id="filelist"></div>
      </div>
    </div>
  </div>
</div>

<div class="footer-note">COM AMOR, WAGNER &amp; VERA</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0eFaI7nF15EFyw6prVJTojXONsrEvsW0KXuD0LDjX-RIhCsBj8roN2JUCRFQX_f3I/exec";

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const filelist = document.getElementById('filelist');
  const filesEmpty = document.getElementById('filesEmpty');
  const filesCount = document.getElementById('filesCount');

  let selectedFiles = [];

  function renderFileList(){
    filelist.innerHTML = '';
    selectedFiles.forEach((file, i) => {
      const row = document.createElement('div');
      row.className = 'file-row';
      row.id = 'file-row-' + i;
      row.innerHTML = `<span>${file.name}</span><span class="status">por enviar</span>`;
      filelist.appendChild(row);
    });
    const has = selectedFiles.length > 0;
    filelist.classList.toggle('has-files', has);
    filesEmpty.classList.toggle('hidden', has);
    filesCount.textContent = selectedFiles.length + '/10';
  }

  function fileToBase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadOne(file, index){
    const row = document.getElementById('file-row-' + index);
    const statusEl = row.querySelector('.status');
    statusEl.textContent = 'a enviar…';
    try {
      const base64 = await fileToBase64(file);
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ filename: file.name, mimeType: file.type || 'image/jpeg', data: base64 })
      });
      statusEl.textContent = 'enviada ✓';
      row.classList.add('done');
    } catch (err) {
      statusEl.textContent = 'erro';
      row.classList.add('error');
    }
  }

  async function handleNewFiles(files){
    const incoming = Array.from(files).filter(f => f.type.startsWith('image/'));
    selectedFiles = incoming.slice(0, 10);
    renderFileList();
    for (let i = 0; i < selectedFiles.length; i++) await uploadOne(selectedFiles[i], i);
  }

  fileInput.addEventListener('change', (e) => handleNewFiles(e.target.files));

  ['dragover','dragenter'].forEach(evt => dropzone.addEventListener(evt, (e) => e.preventDefault()));
  dropzone.addEventListener('drop', (e) => { e.preventDefault(); handleNewFiles(e.dataTransfer.files); });
</script>

</body>
</html>
